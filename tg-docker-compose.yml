# 部署时将本文件保存为 docker-compose.yml，替代原来的基础配置。
# 保留原有的自定义端口和数据路径，并填写下方的 API ID / API Hash。
# 启动和更新：docker compose pull && docker compose up -d
# 网站启动时从本文件自动读取 Bot API 连接地址和共享数据目录。
# Bot Token 和允许的用户 ID 在网站配置面板填写，并启用 Telegram。
services:
  video-site-91:
    image: ghcr.io/nianzhibai/91:stable
    container_name: video-site-91
    ports:
      - "9191:9191"
    environment:
      VIDEO_RESTART_MANAGED: "true"
      VIDEO_TELEGRAM_COMPOSE: /opt/video-site-91/telegram.yml
    volumes:
      - ./data:/opt/video-site-91/data
      - telegram-cache:/var/lib/telegram-bot-api
      # 网站从本部署文件读取 Bot API 端口和共享数据目录配置。
      - ./docker-compose.yml:/opt/video-site-91/telegram.yml:ro
    depends_on:
      - telegram-bot-api
    restart: unless-stopped

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      # 必填：从 my.telegram.org 的 API development tools 获取。
      TELEGRAM_API_ID: ""
      TELEGRAM_API_HASH: ""
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "7878"
    stop_grace_period: 30s
    volumes:
      - telegram-cache:/var/lib/telegram-bot-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  telegram-cache:
