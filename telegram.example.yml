# Copy beside the native website's config.yaml as telegram.yml, fill in
# TELEGRAM_API_ID / TELEGRAM_API_HASH below, then run:
# docker compose -f telegram.yml up -d --pull always
# The website reads the Bot API address and shared data directory at startup.
# Keep TELEGRAM_HTTP_PORT and the container port in ports aligned when changing
# ports; restart both services after changing ports or relocating storage.
name: video-site-telegram
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      # Required: obtain application credentials from my.telegram.org.
      # Configure the Bot Token in the website panel.
      TELEGRAM_API_ID: ""
      TELEGRAM_API_HASH: ""
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "7878"
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - /var/lib/telegram-bot-api:/var/lib/telegram-bot-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
