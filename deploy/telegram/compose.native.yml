# Copy beside the native website's config.yaml as telegram.yml, then run:
# docker compose --env-file .env.telegram -f telegram.yml up -d --pull always
# The website reads this file at startup; change the host side of the data mount
# when relocating the complete Telegram data directory.
name: video-site-telegram
services:
  telegram-bot-api:
    image: ${TELEGRAM_BOT_API_IMAGE:-aiogram/telegram-bot-api:latest}
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env.telegram}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env.telegram}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "7878"
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - /var/lib/telegram-bot-api:/var/lib/telegram-bot-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
