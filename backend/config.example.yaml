# 首次启动时用于创建 config.yaml；已有实例请修改实际配置或使用配置面板。
# 热更新：保存后自动应用。重启生效：保存后需重启网站服务。
# 更换路径或地址时，需自行迁移数据、调整挂载和端口映射。

# 服务：重启生效。
server:
  # 监听地址；本地开发需与 Vite 代理端口一致。
  listen: "127.0.0.1:9192"
  # CORS 白名单；同源部署留空，跨源部署填写完整 Origin，如 https://video.example.com。
  allowed_origins: []

# 存储：重启生效；更换目录前需停服迁移数据。
storage:
  # SQLite 数据库文件。
  db_path: "./data/video-site.db"
  # 封面和预览目录；其父目录同时用于存放上传文件、临时文件和爬虫数据。
  local_preview_dir: "./data/previews"

# 日志：重启生效。
logging:
  # 是否将运行日志写入文件。
  file_enabled: true
  directory: "./data/logs"
  # 单文件上限和总量上限（MiB）；超限后轮转或清理最旧日志。
  max_file_size_mb: 5
  max_total_size_mb: 30

# 扫描：重启生效；定时扫描由 nightly 调度，递归不限深度。
scanner:
  # 扫描的文件扩展名。
  video_extensions: [".mp4", ".mkv", ".mov", ".webm", ".avi", ".strm"]

# 定时任务：热更新，影响后续调度，不中断正在执行的任务。
nightly:
  # 停用自动调度；手动执行不受影响。
  disabled: false
  # 每日启动时间（HH:mm）和任务时区（IANA 名称）。
  start_time: "01:00"
  timezone: "Asia/Shanghai"

# 标签：热更新。
tags:
  # 启用内置标签包。
  builtin_pack_enabled: true

# 媒体生成：热更新；各类并发数独立，所有来源共享，范围 1–5。
generation:
  thumbnail_concurrency: 1
  preview_concurrency: 1
  fingerprint_concurrency: 1

# 预览：enabled 热更新，其余字段重启后用于后续生成。
preview:
  # 控制预览生成和卡片预览；封面不受影响。
  enabled: true
  # 已安装的 ffmpeg / ffprobe 命令名或绝对路径。
  ffmpeg_path: "ffmpeg"
  ffprobe_path: "ffprobe"
  # 单个 ffmpeg 进程的线程数，范围 1–16。
  ffmpeg_threads: 1
  # 预览宽度（像素）；已有预览不会自动重新生成。
  width: 480

# 视频中转：重启生效。
proxy:
  # 允许播放器强制请求服务端中转；关闭后，支持直链的网盘仍使用跳转。
  allow_forced_relay: true

# 下载：重启生效。
remote_upload:
  # 直链和 Telegram 导入保留的磁盘空间（字节），默认 1 GiB。
  disk_reserve_bytes: 1073741824
  # 直链下载正文连续无数据的超时时间（秒）。
  idle_timeout_seconds: 120

# Telegram：热更新，接入设置变更后重建接收器，下载任务会等待重连后重试。
# 需部署配套 Bot API 服务；保存后请在 Telegram 页面确认连接状态。
telegram:
  # 启用需完整凭据；关闭会停止接收器和配套 Bot API 进程。
  enabled: false
  # BotFather 提供的机器人 Token。
  bot_token: ""
  # Telegram 应用凭据；修改后自动重启配套 Bot API 进程。
  api_id: 0
  api_hash: ""
  # 已部署的 Bot API 地址；原生后端通常使用 http://127.0.0.1:7878。
  api_base_url: "http://telegram-bot-api:7878"
  # 共享视频目录；双方须以相同绝对路径读写同一文件系统。
  # 视频在 library 子目录中直接入库，不复制到普通上传目录。
  local_files_root: "/var/lib/telegram-bot-api"
  # 允许发送视频的用户 ID；留空时仅响应 /id 等引导消息。
  allowed_user_ids: []
  # 选填，用于生成机器人回复中的视频链接。
  site_base_url: ""
  # 单文件上限（字节）、待处理任务上限、文件获取超时（秒）。
  max_file_size_bytes: 4294967296
  max_pending_jobs: 100
  fetch_timeout_seconds: 1800
  # 后续转存任务使用的网盘和相对目录；网盘留空时仅保存到本地。
  # 转存沿用 nightly 调度，保存不会立即执行转存。
  upload_drive_id: ""
  upload_directory: "Telegram"
  # 仅用于 TG 网盘转存，支持 HTTP、HTTPS、SOCKS5、SOCKS5H，可含用户名和密码。
  # 留空使用默认网络连接（包括环境代理）；修改后从下一次转存任务生效。
  upload_proxy: ""
