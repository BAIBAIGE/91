# Use with --env-file .env.telegram alongside docker-compose.yml.
# The website reads the shared data mounts from this file at startup.
services:
  video-site-91:
    environment:
      VIDEO_TELEGRAM_COMPOSE: /opt/video-site-91/telegram.yml
    volumes:
      - telegram-cache:/var/lib/telegram-bot-api
      - ./docker-compose.telegram.yml:/opt/video-site-91/telegram.yml:ro
    depends_on:
      - telegram-bot-api
  telegram-bot-api:
    image: ${TELEGRAM_BOT_API_IMAGE:-aiogram/telegram-bot-api:latest}
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env.telegram}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env.telegram}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "7878"
    stop_grace_period: 30s
    volumes:
      - telegram-cache:/var/lib/telegram-bot-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  telegram-cache:
